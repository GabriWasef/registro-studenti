<h2>Elenco degli studenti</h2>

<div class="row g-2 align-items-center mb-3">
  <div class="col-auto">
    <label for="filtro" class="col-form-label">Filtra per classe</label>
  </div>
  <div class="col-auto">
    <input id="filtro" class="form-control" [(ngModel)]="filtroClasse" placeholder="es. 4B">
  </div>
</div>

@if (filtrati().length === 0) {
  <div class="alert alert-warning">
    @if (filtroClasse()) {
      Nessuno studente trovato per la classe {{ filtroClasse() }}
    } @else {
      Il registro è vuoto.
    }
  </div>
} @else {
  <table class="table table-striped table-hover">
    <thead>
      <tr><th>Id</th><th>Nome</th><th>Classe</th><th>Media</th><th></th></tr>
    </thead>
    <tbody>
      @for (s of filtrati(); track s.id) {
        <tr>
          <td>{{ s.id }}</td>
          <td>{{ s.nome }}</td>
          <td>{{ s.classe }}</td>
          <td [class.text-success]="s.mediaVoti >= 6" [class.text-danger]="s.mediaVoti < 6">{{ s.mediaVoti }}</td>
          <td class="text-end">
            <button type="button" class="btn btn-sm btn-outline-danger" (click)="rimuovi(s.id)">Elimina</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
