<h2>Elenco degli studenti</h2>

<table class="table table-striped table-hover">
  <thead>
    <tr><th>Id</th><th>Nome</th><th>Classe</th><th>Media</th><th></th></tr>
  </thead>
  <tbody>
    @for (s of studenti(); track s.id) {
      <tr>
        <td>{{ s.id }}</td>
        <td>{{ s.nome }}</td>
        <td>{{ s.classe }}</td>
        <td [class.text-success]="s.mediaVoti >= 6" [class.text-danger]="s.mediaVoti < 6">{{ s.mediaVoti }}</td>
        <td class="text-end">
          <button type="button" class="btn btn-sm btn-outline-danger" (click)="rimuovi(s.id)">Elimina</button>
        </td>
      </tr>
    }
  </tbody>
</table>
