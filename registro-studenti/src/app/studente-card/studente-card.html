<div class="card-body">
  <h5 class="card-title">{{ studente().nome }}</h5>
  <p class="card-text">
    Classe {{ studente().classe }}, media
    <strong [class.text-success]="studente().mediaVoti >= 6" [class.text-danger]="studente().mediaVoti < 6">
      {{ studente().mediaVoti }}
    </strong>
  </p>
  @if (azioni()) {
    <button type="button" class="btn btn-sm btn-outline-danger" (click)="rimuovi()">Rimuovi dal registro</button>
  }
</div>
